# Render Blueprint — AdresseBJ Backend
# Provisionne le web service + la base PostgreSQL 16 et déclare les variables
# d'environnement. Les secrets (sync: false) sont saisis dans le dashboard à la
# création de l'instance de Blueprint ; les autres sont générés ou fixés ici.
#
# Mise en route : Render → New → Blueprint → connecter ce repo (branche main).
# Détails et étapes manuelles restantes : docs/DEPLOYMENT.md + docs/USER_ACTIONS.md.

databases:
  - name: adressebj-db
    databaseName: adressebj
    plan: free
    region: frankfurt # DOIT être la même région que le service (réseau privé régional)
    postgresMajorVersion: '16'

services:
  - type: web
    name: adressebj-backend
    runtime: node
    plan: free
    region: frankfurt # région gratuite la plus proche du Bénin
    repo: https://github.com/adressebj/adressebj-backend
    branch: main
    # Les migrations tournent au DÉMARRAGE, pas au build : l'hôte interne de la
    # base (dpg-…-a) ne résout qu'au runtime. `migrate deploy` est idempotent
    # (no-op si à jour). Le plan gratuit n'a pas de preDeployCommand.
    # --include=dev : NODE_ENV=production fait sauter les devDeps à npm install,
    # or le build a besoin de @nestjs/cli (nest), typescript, etc.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adressebj-db
          property: connectionString
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # JWT_SECRET généré par Render (jamais commité).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOCALISATION_RADIUS_METERS
        value: '15'
      # Routage / ETA — défauts du code ; OSRM public sans clé, repli gracieux.
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: OSRM_TIMEOUT_MS
        value: '3000'
      - key: ROUTING_FALLBACK_SPEED_KMH
        value: '25'
      # URL du frontend déployé (CORS) — à renseigner dans le dashboard.
      # Valeur de prod : https://adressebj.vercel.app (sans slash final ; liste
      # séparée par des virgules pour plusieurs origines). NB : ce n'est PAS
      # adressebj-frontend.vercel.app — le projet Vercel est « adressebj ».
      - key: ALLOWED_ORIGINS
        sync: false
      # Cloudinary (upload photos signé).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Africa's Talking (OTP SMS) — VOLONTAIREMENT ABSENT.
      # L'intégration SDK n'est pas encore codée (SmsService = stub). Tant qu'elle
      # ne l'est pas, NE PAS définir AT_USERNAME/AT_API_KEY : leur présence bascule
      # SmsService en mode « activé » qui n'envoie rien ET ne logue plus le code.
      # Sans ces vars, le provider dev journalise le code OTP (lisible dans les
      # logs Render) → inscription testable. À rebrancher au passage en live.
      # Web Push (VAPID) — sans ces clés, notifications persistées non poussées.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
